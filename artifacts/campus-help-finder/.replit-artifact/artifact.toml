kind = "web"
previewPath = "/"
title = "Campus Help Finder"
description = "A simple one-page campus help page with a welcome message and a button that displays reassurance."
version = "1.0.0"
id = "artifacts/campus-help-finder"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22280

[services.development]
run = "pnpm --filter @workspace/campus-help-finder run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/campus-help-finder", "run", "build" ]
serve = "static"
publicDir = "artifacts/campus-help-finder/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22280"
BASE_PATH = "/"
